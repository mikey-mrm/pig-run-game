<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>小猪快跑</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="game-shell">
      <section class="topbar" aria-label="游戏信息">
        <div>
          <p class="eyebrow">Fei Zhu Express</p>
          <h1>小猪快跑</h1>
        </div>
        <div class="scoreboard">
          <div class="life-panel" aria-label="生命值">
            <span>生命</span>
            <div class="hearts" id="lives">
              <i></i>
              <i></i>
              <i></i>
            </div>
          </div>
          <div>
            <span>分数</span>
            <strong id="score">0</strong>
          </div>
          <div>
            <span>最佳</span>
            <strong id="best">0</strong>
          </div>
        </div>
      </section>

      <section class="stage-wrap" aria-label="小猪快跑游戏区域">
        <canvas id="game" width="960" height="540"></canvas>
        <div class="overlay" id="overlay">
          <div class="badge">READY</div>
          <h2 id="overlayTitle">快递员小猪准备出发</h2>
          <p id="overlayText">躲开路障，冲过更远的派送路线。</p>
          <button id="startBtn" type="button">开始</button>
        </div>
      </section>

      <section class="control-pad" aria-label="游戏控制">
        <button id="duckBtn" type="button" aria-label="下蹲">↓</button>
        <button id="jumpBtn" type="button" aria-label="跳跃">↑</button>
      </section>
    </main>

    <script src="./game.js"></script>
  </body>
</html>
